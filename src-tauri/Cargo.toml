[package]
name = "parkingpro"
version = "1.0.0"
description = "ParkingPro - Sistema de Gestión de Estacionamientos"
authors = ["ParkingPro"]
edition = "2021"

[lib]
name = "parkingpro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
